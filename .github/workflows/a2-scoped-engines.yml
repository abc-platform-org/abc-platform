name: ABC A2 scoped engine verification
on:
  push:
    branches:
      - implementation/w1-eng05-external-approval-gate-20261101
    paths:
      - 'runtime/phase04/**'
      - '.github/workflows/a2-scoped-engines.yml'
      - 'governance/ABC_A2_SCOPED_CI_EXECUTION_EVIDENCE_20261104.md'
  pull_request:
    paths:
      - 'runtime/phase04/**'
      - '.github/workflows/a2-scoped-engines.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [ENG-01, ENG-02, ENG-03, ENG-04, ENG-05, ENG-06, ENG-14, LEGACY_REVIEW_TRANSPORT]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: abc-integration-only-password
          POSTGRES_DB: abc_phase04_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abc_phase04_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ABC_ENV: LOCAL_INTEGRATION_ONLY
      ABC_TEST_PG_ADMIN_DSN: postgresql://postgres:abc-integration-only-password@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_DSN: postgresql://abc_app:integration-only-abc-app@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_WORKER_DSN: postgresql://abc_worker:integration-only-abc-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ORCHESTRATOR_DSN: postgresql://abc_orchestrator:integration-only-abc-orchestrator@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ANSWER_WORKER_DSN: postgresql://abc_answer_worker:integration-only-abc-answer-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ENG03_DSN: postgresql://abc_eng03_worker:integration-only-eng03-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_PIPELINE_DSN: postgresql://abc_pipeline_worker:integration-only-pipeline-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ENG04_LOGIN_DSN: postgresql://abc_eng04_ci_login:integration-only-eng04-review-login@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ENG05_LOGIN_DSN: postgresql://abc_eng05_ci_login:integration-only-eng05-physical-login@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ENG06_LOGIN_DSN: postgresql://abc_eng06_ci_login:integration-only-eng06-review-login@127.0.0.1:5432/abc_phase04_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r runtime/phase04/requirements.txt
      - name: Bootstrap disposable PostgreSQL
        run: python runtime/phase04/tests/bootstrap_postgres.py
      - name: Execute scoped test files and retain exact logs
        shell: bash
        env:
          A2_SCOPE: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          mkdir -p "a2/$A2_SCOPE"
          case "$A2_SCOPE" in
            ENG-01) files="test_eng01.py test_eng01_pg_command.py test_eng_service_identity.py" ;;
            ENG-02) files="test_eng02_consultation.py test_eng02_signed_pg.py test_eng02_precapture_http.py test_pg_outbox.py" ;;
            ENG-03) files="test_eng03_durable_pipeline.py test_eng03_06_pipeline.py" ;;
            ENG-04) files="test_eng04_isolated_worker.py test_eng04_scoped_real_visual.py test_eng04_visual_qa_real_pixels.py" ;;
            ENG-05) files="test_eng05_professional_sources.py test_eng05_external_authority_pg_integration.py test_eng05_revocation_race.py" ;;
            ENG-06) files="test_eng06_pg_deployed_contract.py test_eng06_fault_injection_acceptance.py test_eng06_pg_isolation_negative.py" ;;
            ENG-14) files="test_eng14_professional_gate.py test_eng14_transition_gate.py test_answer_consumer_eng14.py" ;;
            LEGACY_REVIEW_TRANSPORT) files="test_eng19_actual_mtls_handoff_pg.py" ;;
            *) exit 2 ;;
          esac
          printf 'scope=%s\nsha=%s\nrun_id=%s\njob=%s\nindependent_attestation=NONE\n' "$A2_SCOPE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" > "a2/$A2_SCOPE/provenance.txt"
          for file in $files; do
            test -f "runtime/phase04/tests/$file"
            echo "Running $file"
            (cd runtime/phase04 && python -m unittest discover -s tests -p "$file" -v) 2>&1 | tee "a2/$A2_SCOPE/$file.log"
            grep -Eq 'Ran [1-9][0-9]* tests? in' "a2/$A2_SCOPE/$file.log"
            if grep -Eq 'skipped=[1-9]|FAILED ' "a2/$A2_SCOPE/$file.log"; then exit 1; fi
          done
          sha256sum "a2/$A2_SCOPE/"*.log > "a2/$A2_SCOPE/log-sha256.txt"
          A2_SCOPE="$A2_SCOPE" python - <<'PY'
          import glob, os, pathlib, re, xml.etree.ElementTree as ET
          scope=os.environ["A2_SCOPE"]
          out=pathlib.Path("a2")/scope
          suite=ET.Element("testsuite",name=scope)
          total=0
          for path in sorted(glob.glob(str(out/"test_*.py.log"))):
              data=pathlib.Path(path).read_text()
              # unittest can emit warnings between the testcase header and its final status.
              # Parse each testcase block, not only one-line "test ... ok" records.
              starts=list(re.finditer(r"^(test[^ ]+) \(([^)]+)\)(?=\s|$)",data,re.M))
              matches=[]
              for idx,match in enumerate(starts):
                  tail=data[match.end():starts[idx+1].start() if idx+1<len(starts) else len(data)]
                  tail=tail.split("----------------------------------------------------------------------",1)[0]
                  statuses=re.findall(r"(?:^|\n)\s*(ok|FAIL|ERROR|skipped .*|expected failure|unexpected success)\s*(?=\n|$)",tail)
                  # Warnings can interrupt unittest output before the final result.
                  if not statuses and tail.rstrip().endswith("ok"):
                      statuses=["ok"]
                  if len(statuses)!=1:
                      raise SystemExit(f"Ambiguous testcase outcome in {path}: {match.group(1)}")
                  matches.append((match.group(1),match.group(2),statuses[0]))
              if not re.search(r"^OK$",data,re.M) or re.search(r"^FAILED |^ERROR:|^FAIL:|^OK \(skipped=",data,re.M):
                  raise SystemExit(f"Unclean unittest outcome: {path}")
              if any(status!="ok" for _,_,status in matches):
                  raise SystemExit(f"Non-PASS test outcome: {path}")
              if len({(name,klass) for name,klass,_ in matches})!=len(matches):
                  raise SystemExit(f"Duplicate testcase identifiers: {path}")
              for name,klass,status in matches:
                  case=ET.SubElement(suite,"testcase",name=name,classname=klass)
                  if status!="ok":
                      ET.SubElement(case,"failure",message=status)
                  total+=1
          expected=sum(int(v) for path in glob.glob(str(out/"test_*.py.log")) for v in re.findall(r"Ran (\d+) tests? in",pathlib.Path(path).read_text()))
          if not total or total != expected:
              raise SystemExit(f"JUnit case count mismatch: parsed={total}, unittest={expected}")
          suite.set("tests",str(total))
          ET.ElementTree(suite).write(out/"junit.xml",encoding="utf-8",xml_declaration=True)
          print(f"Captured {total} scoped test cases")
          import hashlib, json, platform
          records=[{"id":e.get("classname","")+"."+e.get("name",""),"result":"PASS" if not list(e) else "FAIL"} for e in suite.findall("testcase")]
          manifest={"schema":"abc.a2.test-manifest.v1","scope":scope,"sha":os.environ.get("GITHUB_SHA"),"run_id":os.environ.get("GITHUB_RUN_ID"),"job":os.environ.get("GITHUB_JOB"),"python":platform.python_version(),"tests":records,"test_count":total,"failures":sum(v["result"]!="PASS" for v in records),"reviewer_attestation":None,"gate_approval":False}
          (out/"test-manifest.json").write_text(json.dumps(manifest,indent=2)+"\\n")
          hashes={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file()}
          (out/"evidence-index.json").write_text(json.dumps({"scope":scope,"run_id":os.environ.get("GITHUB_RUN_ID"),"sha256":hashes,"gate_disposition":"OPEN"},indent=2)+"\\n")
          PY
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-${{ matrix.scope }}-${{ github.run_id }}
          path: a2/${{ matrix.scope }}/
          if-no-files-found: warn
          retention-days: 30

  security-and-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: abc-integration-only-password
          POSTGRES_DB: abc_phase04_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abc_phase04_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ABC_ENV: LOCAL_INTEGRATION_ONLY
      ABC_TEST_PG_ADMIN_DSN: postgresql://postgres:abc-integration-only-password@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_DSN: postgresql://abc_app:integration-only-abc-app@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_WORKER_DSN: postgresql://abc_worker:integration-only-abc-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ORCHESTRATOR_DSN: postgresql://abc_orchestrator:integration-only-abc-orchestrator@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ANSWER_WORKER_DSN: postgresql://abc_answer_worker:integration-only-abc-answer-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ENG03_DSN: postgresql://abc_eng03_worker:integration-only-eng03-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_PIPELINE_DSN: postgresql://abc_pipeline_worker:integration-only-pipeline-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ENG04_LOGIN_DSN: postgresql://abc_eng04_ci_login:integration-only-eng04-review-login@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ENG05_LOGIN_DSN: postgresql://abc_eng05_ci_login:integration-only-eng05-physical-login@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ENG06_LOGIN_DSN: postgresql://abc_eng06_ci_login:integration-only-eng06-review-login@127.0.0.1:5432/abc_phase04_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r runtime/phase04/requirements.txt
      - run: python runtime/phase04/tests/bootstrap_postgres.py
      - name: Security and negative-case evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p a2/security
          for file in test_eng06_pg_isolation_negative.py test_eng05_revocation_race.py test_eng14_transition_gate.py test_eng_service_identity.py; do
            (cd runtime/phase04 && python -m unittest discover -s tests -p "$file" -v) 2>&1 | tee "a2/security/$file.log"
            grep -Eq 'Ran [1-9][0-9]* tests? in' "a2/security/$file.log"
            ! grep -Eq 'skipped=[1-9]|FAILED ' "a2/security/$file.log"
          done
          sha256sum a2/security/*.log > a2/security/sha256.txt
      - name: Fault injection and recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p a2/reliability
          for file in test_eng06_fault_injection_acceptance.py test_eng03_durable_pipeline.py; do
            (cd runtime/phase04 && python -m unittest discover -s tests -p "$file" -v) 2>&1 | tee "a2/reliability/$file.log"
            grep -Eq 'Ran [1-9][0-9]* tests? in' "a2/reliability/$file.log"
            ! grep -Eq 'skipped=[1-9]|FAILED ' "a2/reliability/$file.log"
          done
          sha256sum a2/reliability/*.log > a2/reliability/sha256.txt
      - name: Verify negative and recovery test results with structured manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          for kind in ("security","reliability"):
              folder=pathlib.Path("a2")/kind
              cases=[]
              for path in sorted(folder.glob("test_*.py.log")):
                  raw=path.read_text()
                  summaries=[int(x) for x in re.findall(r"Ran (\d+) tests? in",raw)]
                  names=re.findall(r"^(test[^ ]+) \(([^)]+)\)(?: \.\.\.)?",raw,re.M)
                  if len(summaries)!=1 or len(names)!=summaries[0] or re.search(r"FAILED |skipped=[1-9]|^ERROR:|^FAIL:",raw,re.M) or not re.search(r"^OK$",raw,re.M):
                      raise SystemExit(f"Invalid test evidence: {path}: names={len(names)} totals={summaries}")
                  cases.extend({"id":klass+"."+name,"result":"PASS","source_log":path.name} for name,klass in names)
              if not cases:
                  raise SystemExit(f"No {kind} cases")
              digest={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(folder.glob("*.log"))}
              report={"schema":"abc.a2.negative-evidence.v1","category":kind,"sha":os.environ.get("GITHUB_SHA"),"run_id":os.environ.get("GITHUB_RUN_ID"),"case_count":len(cases),"cases":cases,"log_sha256":digest,"independent_approval":False,"gate_status":"OPEN"}
              name="negative-results.json" if kind=="security" else "fault-results.json"
              (folder/name).write_text(json.dumps(report,indent=2)+"\\n")
              print(kind,len(cases))
          PY
      - name: Upload security and reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-security-reliability-${{ github.run_id }}
          path: |
            a2/security/
            a2/reliability/
          if-no-files-found: error
          retention-days: 30

  performance-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure deterministic local-only JSON serialization baseline
        run: |
          mkdir -p a2/performance
          python - <<'PY'
          import json, os, platform, statistics, time
          from pathlib import Path
          payload={"scope":"A2_SYNTHETIC_SERIALIZATION_ONLY","engine":"ENG-01","evidence":[{"id":i,"status":"SYNTHETIC"} for i in range(20)]}
          samples=[]
          for _ in range(1200):
              start=time.perf_counter_ns()
              json.loads(json.dumps(payload,sort_keys=True))
              samples.append((time.perf_counter_ns()-start)/1_000_000)
          samples.sort()
          def percentile(p):
              return samples[min(len(samples)-1, int((len(samples)-1)*p))]
          report={"workload":"Python JSON encode/decode microbenchmark ONLY","samples":len(samples),"p50_ms":percentile(.5),"p95_ms":percentile(.95),"p99_ms":percentile(.99),"max_ms":max(samples),"runner":os.getenv("RUNNER_NAME"),"python":platform.python_version(),"sha":os.getenv("GITHUB_SHA"),"run_id":os.getenv("GITHUB_RUN_ID"),"production_slo_valid":False,"engine_end_to_end_performance_verified":False,"threshold_status":"NOT_DEFINED"}
          Path("a2/performance/benchmark.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report))
          PY
      - name: Upload performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-performance-baseline-${{ github.run_id }}
          path: a2/performance/
          if-no-files-found: error
          retention-days: 30

  process-boundary-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real isolated engine dependencies
        run: python -m pip install -r runtime/phase04/requirements.txt
      - name: Verify real isolated engine process crash containment
        run: |
          mkdir -p a2/process-boundary
          set -o pipefail
          python -m unittest discover -s runtime/phase04/tests -p test_a2_process_boundary.py -v 2>&1 | tee a2/process-boundary/unittest.log
          grep -Eq '^Ran 3 tests in' a2/process-boundary/unittest.log
          grep -Eq '^OK$' a2/process-boundary/unittest.log
          sha256sum a2/process-boundary/unittest.log > a2/process-boundary/sha256.txt
      - name: Upload real-process synthetic boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-process-boundary-${{ github.run_id }}
          path: a2/process-boundary/
          if-no-files-found: error
          retention-days: 30
