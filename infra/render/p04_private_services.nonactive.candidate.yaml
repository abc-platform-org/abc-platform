# ABC P04 NON-ACTIVE PRIVATE SERVICES CANDIDATE: DO NOT APPLY UNTIL OPERATOR BUDGET/PKI/DB GATES PASS.
# Source: P04 infrastructure selection manifest. There is intentionally NO Render-managed database.
# This deploys synthetic v1 engine network listeners ONLY; production v2 routing remains DISABLED.
# Private networking to an externally controlled mTLS Postgres requires independent operator validation.
# No external customer data, public web service, auto deploy, keys, bearer tokens or URLs in source.
services:
  - type: pserv
    name: abc-p04-private-api
    runtime: docker
    plan: starter
    region: frankfurt
    branch: security/p04-distributed-replay-managed-db-v2-gate-20261030
    autoDeployTrigger: 'off'
    dockerContext: runtime/phase04
    dockerfilePath: runtime/phase04/Dockerfile
    dockerCommand: python -m abc_foundation.staging_api
    numInstances: 1
    envVars:
      - key: ABC_ENV
        value: STAGING_PRIVATE
      - key: ABC_STAGING_PURPOSE
        value: SYNTHETIC_NO_CLIENT_DATA
      - key: ABC_NETWORK_BOUNDARY
        value: RENDER_PRIVATE_SERVICE
      - key: ABC_DB_AUTH_MODE
        value: 'MANAGED_MTLS'
      - key: ABC_API_TRANSPORT
        value: 'MTLS_TLS13'
      - key: PORT
        value: '10000'
      - key: ABC_PG_DSN
        sync: false
      - key: ABC_DB_WORKLOAD_LOGIN
        sync: false
      - key: ABC_DB_CLIENT_DN
        sync: false
      - key: ABC_DB_ISSUER_DN
        sync: false
      - key: ABC_DB_CERT_SERIAL
        sync: false
      - key: ABC_API_TLS_CERT_FILE
        sync: false
      - key: ABC_API_TLS_KEY_FILE
        sync: false
      - key: ABC_API_TLS_CA_FILE
        sync: false
      - key: ABC_API_ALLOWED_CLIENT_URIS
        sync: false
      - key: ABC_OIDC_ISSUER
        sync: false
      - key: ABC_OIDC_AUDIENCE
        sync: false
      - key: ABC_OIDC_JWKS_URI
        sync: false
