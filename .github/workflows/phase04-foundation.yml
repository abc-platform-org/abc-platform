name: ABC Phase 04 local foundation CI
on:
  pull_request:
    paths:
      - 'runtime/phase04/**'
      - 'infra/render/**'
      - 'docs/04-platform/**'
      - 'governance/**'
      - 'scripts/validate_engine_quality.py'
      - 'scripts/validate_abc_v2_architecture.py'
      - 'scripts/validate_abc_19_engine_architecture.py'
      - 'scripts/validate_abc_v2_19_adapters.py'
      - 'scripts/validate_eng19_review_inbox.py'
      - 'scripts/validate_eng05_review_worker.py'
      - 'contracts/review/**'
      - 'scripts/validate_phase04_readiness.py'
      - 'scripts/validate_p04_provider_fit.py'
      - 'prototypes/abc-ai-studio-v2/**'
      - '.github/workflows/phase04-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: abc-integration-only-password
          POSTGRES_DB: abc_phase04_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abc_phase04_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ABC_ENV: LOCAL_INTEGRATION_ONLY
      ABC_TEST_PG_ADMIN_DSN: postgresql://postgres:abc-integration-only-password@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_DSN: postgresql://abc_app:integration-only-abc-app@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_WORKER_DSN: postgresql://abc_worker:integration-only-abc-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ORCHESTRATOR_DSN: postgresql://abc_orchestrator:integration-only-abc-orchestrator@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ANSWER_WORKER_DSN: postgresql://abc_answer_worker:integration-only-abc-answer-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_ENG03_DSN: postgresql://abc_eng03_worker:integration-only-eng03-worker@127.0.0.1:5432/abc_phase04_ci
      ABC_TEST_PG_PIPELINE_DSN: postgresql://abc_pipeline_worker:integration-only-pipeline-worker@127.0.0.1:5432/abc_phase04_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight ENG05 migration SQL structure before database bootstrap
        run: python scripts/validate_eng05_review_worker.py
      - name: Install trusted JWT and PostgreSQL client libraries
        run: python -m pip install -r runtime/phase04/requirements.txt
      - name: Apply PostgreSQL migration with least-privilege runtime role
        run: python runtime/phase04/tests/bootstrap_postgres.py
      - name: Install audited Blueprint YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Enforce private Render staging topology
        run: python scripts/validate_phase04_staging.py
      - name: Reject incompatible provider, public service, billing and unsupported database in P04 candidate
        run: python scripts/validate_p04_provider_fit.py
      - name: Validate 41-operation Phase-02/04 traceability
        run: python scripts/validate_phase04.py
      - name: ENG-01 canonical workflow state graph integrity
        run: python scripts/validate_eng01.py
      - name: Enforce seven-engine completion evidence gates (no false COMPLETE)
        run: python scripts/validate_engine_quality.py
      - name: Verify v2 ownership, frozen v1 and protected offline AI Studio
        run: python scripts/validate_abc_v2_architecture.py
      - name: Validate 19 canonical logical owners, versioned handoffs and seven non-bypassable policy gates
        run: python scripts/validate_abc_19_engine_architecture.py
      - name: Enforce six review-only and unmigrated v2-to-19 source adapters
        run: python scripts/validate_abc_v2_19_adapters.py
      - name: Verify review inbox DB edges equal the canonical 19-engine graph
        run: python scripts/validate_eng19_review_inbox.py
      - name: Reject unsafe ENG05 worker identity, stale lease and automatic ENG06 release
        run: python scripts/validate_eng05_review_worker.py
      - name: Phase04 externally evidenced release gate remains closed
        run: python scripts/validate_phase04_readiness.py
      - name: Compile local-only runtime
        run: python -m compileall -q runtime/phase04/abc_foundation
      - name: Execute integration, isolation, replay and persistence tests
        working-directory: runtime/phase04
        run: python -m unittest discover -s tests -v
      - name: Verify dedicated staging migrator against isolated ephemeral PostgreSQL
        working-directory: runtime/phase04
        run: python tests/verify_staging_migration_ci.py
      - name: Execute synthetic-only consultation to decision offline walkthrough
        working-directory: runtime/phase04
        env:
          ABC_DEMO_SYNTHETIC: "yes"
        run: |
          python demo_offline_engines.py > /tmp/abc-synthetic-demo.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/abc-synthetic-demo.json').read_text())
          assert p["simulation"] == "SYNTHETIC_INTERNAL_ONLY"
          assert p["released_to_customers"] is False
          assert p["paid_API_calls"] == 0
          assert p["question_count"] == 4
          assert p["human_validation"] == "REQUIRED_BEFORE_REAL_USE"
          assert p["conditionally_listed_test_candidates"] == ["synthetic:style-a"]
          print("PASS: no-API controlled ENG02→03→04+05→06 synthetic demo")
          PY
      - name: Verify actual isolated PostgreSQL client certificate authentication
        run: python runtime/phase04/tests/verify_real_pg_mtls_ci.py
      - name: Build nonroot staging container from exact PR code
        run: docker build -f runtime/phase04/Dockerfile -t abc-phase04-staging:ci runtime/phase04
      - name: Verify image runs as dedicated unprivileged UID
        run: |
          test "$(docker image inspect abc-phase04-staging:ci --format '{{.Config.User}}')" = "10001:10001"
          echo "PASS: nonroot runtime user"
      - name: Verify container refuses unconfigured staging startup
        run: |
          if docker run --rm abc-phase04-staging:ci python -m abc_foundation.staging_api; then
            echo "FAIL: staging container started without credentials and private environment" >&2
            exit 1
          fi
          echo "PASS: no implicit staging credentials or public start"
      - name: Check strict source constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('runtime/phase04/abc_foundation')
          server=(root/'server.py').read_text()
          api=(root/'http_api.py').read_text()
          assert 'ABC_ENV' in server and 'LOCAL_INTEGRATION_ONLY' in server
          assert 'if host not in ("127.0.0.1", "::1")' in api
          assert 'capability_not_implemented' in api
          assert 'verify_bearer' in api
          print('PASS: explicit loopback/local-only and fail-closed stubs')
          PY
