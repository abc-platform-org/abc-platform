name: Phase 03 design and prototype integrity
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_phase03.py
      - run: python scripts/build_phase03_review.py --check
      - run: node --check prototypes/phase03/app.mjs
      - run: node --check prototypes/phase03/management.mjs
      - run: node --check prototypes/phase03/management-model.mjs
      - run: node --test tests/phase03/model.test.mjs tests/phase03/management.test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Serve synthetic prototypes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory prototypes/phase03 >/tmp/abc-phase03-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/abc-phase03-http.log
          exit 1
      - name: Run real Chromium E2E checks
        run: npx playwright test tests/phase03/browser.spec.mjs --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-phase03-browser-evidence
          path: test-results/
          retention-days: 7
