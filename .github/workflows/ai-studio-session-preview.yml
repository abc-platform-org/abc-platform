name: ABC AI Studio synthetic session browser tests

on:
  pull_request:
    paths:
      - 'runtime/phase04/studio_preview/**'
      - 'runtime/phase04/abc_foundation/**'
      - 'contracts/v1/schemas/session.schema.json'
      - 'prototypes/abc-ai-studio-v2/**'
      - '.github/workflows/ai-studio-session-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0 jsonschema==4.25.1
          python -m playwright install --with-deps chromium
      - name: Verify synthetic consultation creation and refresh recovery
        working-directory: runtime/phase04
        env:
          ABC_ENV: LOCAL_INTEGRATION_ONLY
        run: python -m studio_preview.verify_browser
